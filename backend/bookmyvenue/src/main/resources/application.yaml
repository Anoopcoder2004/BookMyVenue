spring:
  application:
    name: bookmyvenue

  datasource:
    url: jdbc:postgresql://localhost:5432/bookmyvenue
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect