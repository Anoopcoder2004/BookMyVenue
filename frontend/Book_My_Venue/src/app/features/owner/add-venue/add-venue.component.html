<div class="add-venue-container">
  <h2>Add New Venue</h2>

  <form [formGroup]="venueForm" (ngSubmit)="onSubmit()">

    <div class="form-group">
      <label>Venue Name</label>
      <input type="text" formControlName="name" placeholder="Enter venue name">
    </div>

    <div class="form-group">
      <label>Location</label>
      <input type="text" formControlName="location" placeholder="Enter location">
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Price</label>
        <input type="number" formControlName="price" placeholder="Enter price">
      </div>

      <div class="form-group">
        <label>Capacity</label>
        <input type="number" formControlName="capacity" placeholder="Enter capacity">
      </div>
    </div>

    <div class="form-group">
      <label>Description</label>
      <textarea formControlName="description" rows="4" placeholder="Enter description"></textarea>
    </div>
    <div class="form-group">
  <label>Upload Images (1–5)</label>

  <input 
    type="file" 
    multiple 
    accept="image/*"
    (change)="onFileSelect($event)"
  />

  <!-- Preview -->
  <div class="preview-grid">
    <div class="preview-item" *ngFor="let img of previews; let i = index">
      <img [src]="img" />
      <button type="button" (click)="removeImage(i)">✕</button>
    </div>
  </div>

  <!-- Error -->
  <p class="error" *ngIf="imageError">
    {{ imageError }}
  </p>
</div>

    <button type="submit" [disabled]="venueForm.invalid">
      Add Venue
    </button>

  </form>
</div>
